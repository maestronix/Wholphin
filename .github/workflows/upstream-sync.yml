name: Upstream sync

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/damontecres/Wholphin.git
          git fetch upstream main --tags
          git fetch origin main

      - name: Check for upstream changes
        id: changes
        run: |
          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream into sync branch
        if: steps.changes.outputs.needed == 'true'
        id: merge
        continue-on-error: true
        run: |
          git checkout -B upstream-sync origin/main
          git merge --no-edit upstream/main

      - name: Push sync branch
        if: steps.changes.outputs.needed == 'true' && steps.merge.outcome == 'success'
        run: |
          git push --force origin upstream-sync

      - name: Create or update sync pull request
        if: steps.changes.outputs.needed == 'true' && steps.merge.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh pr list --base main --head upstream-sync --state open --json number --jq 'length' | grep -q '^0$'; then
            gh pr create --base main --head upstream-sync \
              --title "chore: sync upstream Wholphin" \
              --body "Automated merge of damontecres/Wholphin:main into this fork. Review any conflicts or changes to fork-specific behavior before merging."
          fi

      - name: Report merge conflicts
        if: steps.changes.outputs.needed == 'true' && steps.merge.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Upstream sync needs manual conflict resolution"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body "The scheduled upstream merge from damontecres/Wholphin:main into this fork's main branch encountered conflicts. Resolve them on an upstream-sync branch, then close this issue."
          fi
